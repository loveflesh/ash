<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이리 Air · OC Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --text:#ececec;
    --muted:#9a9a9a;
    --line:rgba(255,255,255,.18);
    --ease:cubic-bezier(.65,0,.2,1);
    --ov:.55;                         /* 겹침 비율: 클수록 더 많이 겹침 (0~0.8) */
    --k:calc((2 - var(--ov)) * 1523 / 3395); /* 전신 한 쌍의 가로/세로 비율 */
    --H:min(84vh, calc(46vw / var(--k)));    /* 전신 높이 */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,#3b3b3b 0%,#222 30%,#111 62%,#060606 100%) fixed;
    overflow-x:hidden;
  }

  /* ---------- 빛먼지: 사방으로 이리저리 떠다님 ---------- */
  .dust{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .dust i{
    position:absolute;left:var(--px);top:var(--py);
    width:var(--s);height:var(--s);border-radius:50%;
    background:rgba(255,255,255,.9);
    box-shadow:0 0 calc(var(--s)*4) rgba(255,255,255,.5);
    opacity:0;
    animation:
      drift var(--d) ease-in-out var(--delay) infinite,
      twinkle var(--t) ease-in-out var(--delay2) infinite;
  }
  @keyframes drift{
    0%  {transform:translate(0,0)}
    25% {transform:translate(var(--x1),var(--y1))}
    50% {transform:translate(var(--x2),var(--y2))}
    75% {transform:translate(var(--x3),var(--y3))}
    100%{transform:translate(0,0)}
  }
  @keyframes twinkle{
    0%,100%{opacity:0}
    30%,70%{opacity:var(--o)}
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(60% 50% at 30% 20%,rgba(255,255,255,.06),transparent 70%);
    animation:glow 9s ease-in-out infinite alternate;
  }
  @keyframes glow{from{opacity:.5}to{opacity:1}}

  /* ---------- 레이아웃 ---------- */
  .wrap{
    position:relative;z-index:1;
    min-height:100vh;
    display:grid;grid-template-columns:auto 1fr;
    gap:4vw;align-items:center;
    padding:4vh 6vw;
    max-width:1400px;margin:0 auto;
  }
  .figures,.info{transition:transform 1.2s var(--ease)}
  .is-back .figures{transform:translateX(var(--fx,0px))}
  .is-back .info{transform:translateX(var(--ix,0px))}

  /* 이동 중 블러 → 또렷 */
  .swapping .figures,.swapping .info{animation:blurpulse 1.2s ease both}
  @keyframes blurpulse{
    0%  {filter:blur(0);opacity:1}
    38% {filter:blur(14px);opacity:.45}
    100%{filter:blur(0);opacity:1}
  }

  /* 전신 (앞/뒤 겹쳐서) */
  .figures{position:relative;height:var(--H);min-height:360px;width:calc(var(--H) * var(--k))}
  .fig{
    all:unset;cursor:pointer;position:absolute;bottom:0;
    height:100%;aspect-ratio:1523/3395;display:block;
    --sc:.94;--y:0px;
    transform:translateY(var(--y)) scale(var(--sc));
    transform-origin:50% 100%;
    filter:brightness(.6) drop-shadow(0 0 0 rgba(255,255,255,0));
    transition:transform 1.1s var(--ease),filter 1.1s var(--ease);
    z-index:1;
  }
  .fig img{height:100%;width:100%;display:block;pointer-events:none}
  .fig.front{left:0}
  .fig.back{right:0}
  .fig.active{
    --sc:1.03;z-index:3;
    filter:brightness(1) drop-shadow(0 0 22px rgba(255,255,255,.22));
  }
  .fig:hover{--y:-8px;filter:brightness(.85) drop-shadow(0 0 16px rgba(255,255,255,.16))}
  .fig.active:hover{filter:brightness(1.05) drop-shadow(0 0 26px rgba(255,255,255,.3))}
  .fig:focus-visible{outline:1px dashed var(--muted);outline-offset:6px}
  .fig span{
    position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.2em;color:var(--muted);
    opacity:0;transition:opacity .4s;white-space:nowrap;
  }
  .fig:hover span,.fig.active span{opacity:1}

  /* 정보 */
  .info{position:relative}
  .inner{max-width:560px}
  h1{margin:0 0 6px;font-size:clamp(34px,5vw,56px);font-weight:600;letter-spacing:-.02em}
  h1 small{font-size:.42em;font-weight:400;color:var(--muted);margin-left:.5em;letter-spacing:.12em}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  .panel{display:none}
  .panel.show{display:block}
  .tag{display:inline-block;font-size:11px;letter-spacing:.25em;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px;margin-bottom:18px}
  dl{margin:0;display:grid;grid-template-columns:92px 1fr;gap:14px 16px;font-size:15px;line-height:1.7}
  dt{color:var(--muted)}
  dd{margin:0;border-bottom:1px solid var(--line);padding-bottom:12px}
  .desc{margin-top:26px;color:#cfcfcf;line-height:1.9;font-size:15px}
  .secret dd{border-color:rgba(255,255,255,.1)}

  footer{position:fixed;right:22px;bottom:14px;z-index:2;font-size:12px;color:#666;letter-spacing:.1em}

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;gap:24px;padding:24px 20px 60px}
    :root{--H:min(62vh, calc((100vw - 40px) / var(--k)))}
    .wrap{justify-items:center}
    .info{justify-self:stretch}
  }
  @media (prefers-reduced-motion:reduce){
    .dust i,body::before,.swapping .figures,.swapping .info{animation:none}
    .figures,.info,.fig{transition:none}
  }
</style>
</head>
<body>

<div class="dust" id="dust" aria-hidden="true"></div>

<main class="wrap" id="wrap">
  <!-- 전신 -->
  <div class="figures" id="figures">
    <button class="fig front active" data-target="basic" aria-label="앞모습 — 기본 프로필 보기">
      <img src="images/front.png" alt="아이리 앞모습" data-ph="FRONT">
      <span>FRONT</span>
    </button>
    <button class="fig back" data-target="secret" aria-label="뒷모습 — 비설 보기">
      <img src="images/back.png" alt="아이리 뒷모습" data-ph="BACK">
      <span>BACK</span>
    </button>
  </div>

  <!-- 정보 -->
  <section class="info" id="info">
    <div class="inner">
      <h1>아이리<small>Air</small></h1>
      <p class="sub">앞모습을 누르면 기본 프로필, 뒷모습을 누르면 비설이 열려요.</p>

      <!-- 기본 프로필 (여기 내용만 바꾸면 돼요) -->
      <div class="panel show" id="basic">
        <span class="tag">PROFILE</span>
        <dl>
          <dt>이름</dt><dd>아이리 (Air)</dd>
          <dt>나이</dt><dd>00세</dd>
          <dt>키 / 체중</dt><dd>000cm / 00kg</dd>
          <dt>종족</dt><dd>—</dd>
          <dt>성격</dt><dd>—</dd>
          <dt>좋아하는 것</dt><dd>—</dd>
          <dt>싫어하는 것</dt><dd>—</dd>
        </dl>
        <p class="desc">여기에 캐릭터 소개 문장을 적어주세요. 외형, 분위기, 간단한 배경 등 기본 설정을 자유롭게 넣으면 됩니다.</p>
      </div>

      <!-- 비설 -->
      <div class="panel secret" id="secret">
        <span class="tag">SECRET</span>
        <dl>
          <dt>비설 1</dt><dd>—</dd>
          <dt>비설 2</dt><dd>—</dd>
          <dt>비설 3</dt><dd>—</dd>
        </dl>
        <p class="desc">여기에 비공개 설정(비설)을 적어주세요.</p>
      </div>
    </div>
  </section>
</main>

<footer>© Ash832</footer>

<script>
  // ---------- 빛먼지 생성 (사방으로 떠다니는 입자) ----------
  (function(){
    const box=document.getElementById('dust');
    const N=matchMedia('(max-width:820px)').matches?36:64;
    const r=(a,b)=>a+Math.random()*(b-a);
    for(let i=0;i<N;i++){
      const p=document.createElement('i');
      const R=()=>r(-140,140).toFixed(0)+'px';
      p.style.cssText=
        `--px:${r(0,100)}%;--py:${r(0,100)}%;--s:${r(1.5,5)}px;--o:${r(.25,.75)};`+
        `--d:${r(18,40)}s;--delay:${-r(0,40)}s;--t:${r(5,11)}s;--delay2:${-r(0,11)}s;`+
        `--x1:${R()};--y1:${R()};--x2:${R()};--y2:${R()};--x3:${R()};--y3:${R()}`;
      box.appendChild(p);
    }
  })();

  // ---------- 앞/뒤 전환 ----------
  const wrap=document.getElementById('wrap');
  const figures=document.getElementById('figures');
  const info=document.getElementById('info');
  const figs=document.querySelectorAll('.fig');
  const panels=document.querySelectorAll('.panel');
  let current='basic', busy=false;

  // 전신 영역과 글자 영역이 서로 자리를 바꾸도록 이동 거리 계산
  function measure(){
    if(matchMedia('(max-width:820px)').matches){
      wrap.style.setProperty('--fx','0px');wrap.style.setProperty('--ix','0px');return;
    }
    const fx=(info.offsetLeft+info.offsetWidth)-(figures.offsetLeft+figures.offsetWidth);
    const ix=figures.offsetLeft-info.offsetLeft;
    wrap.style.setProperty('--fx',fx+'px');
    wrap.style.setProperty('--ix',ix+'px');
  }
  measure();
  addEventListener('resize',measure);
  addEventListener('load',measure);

  function go(target){
    if(target===current||busy) return;
    busy=true;current=target;
    wrap.classList.toggle('is-back',target==='secret');
    wrap.classList.add('swapping');
    figs.forEach(f=>f.classList.toggle('active',f.dataset.target===target));
    // 가장 흐려진 순간에 내용 교체
    setTimeout(()=>panels.forEach(p=>p.classList.toggle('show',p.id===target)),460);
    setTimeout(()=>{wrap.classList.remove('swapping');busy=false},1250);
  }
  figs.forEach(f=>f.addEventListener('click',()=>go(f.dataset.target)));

  // ---------- 이미지 없을 때 예시 실루엣 ----------
  document.querySelectorAll('.fig img').forEach(img=>{
    img.addEventListener('error',()=>{
      const back=img.dataset.ph==='BACK';
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 560" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="110" cy="62" rx="40" ry="46"/>
        <path d="M70 120 Q110 108 150 120 L170 250 L158 290 L164 540 L118 540 L110 330 L102 540 L56 540 L62 290 L50 250 Z"/>
        ${back?'<path d="M110 120 L110 300" stroke-width="2" opacity=".5"/>':'<circle cx="96" cy="60" r="3" fill="#fff"/><circle cx="124" cy="60" r="3" fill="#fff"/>'}
      </svg>`;
      img.src='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
    },{once:true});
  });
</script>
</body>
</html>
